# 澳门组
  - name: 澳门-故转
    type: fallback
    interval: 300
    lazy: false
    proxies:
      - 澳门-手动
      - 澳门-自动

  - name: 澳门-手动
    type: select
    include-all: true
    filter: "(?=.*(澳门|澳門|MO|Macau|🇲🇴)).*$"

  - name: 澳门-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "(?=.*(澳门|澳門|MO|Macau|🇲🇴)).*$"