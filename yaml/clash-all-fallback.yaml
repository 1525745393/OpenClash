# clash-all-fallback.yaml

proxy-providers:
  provider-1:
    type: http
    url: https://example.com/proxy-1.yaml
    interval: 3600

  provider-2:
    type: file
    path: /etc/proxy-2.yaml

proxies:
  - name: Proxy 1
    type: ss
    server: server1.com
    port: 8388
    cipher: aes-256-gcm
    password: password1
  - name: Proxy 2
    type: vmess
    server: server2.com
    port: 443
    uuid: uuid-1234

ports:
  # ports for different protocols
  'http': 8080
  'https': 8443
  'redir': 7892

allow-lan: true

mode: Rule

external-controller: 0.0.0.0:9090

# DNS settings
dns:
  servers:
    - 8.8.8.8
    - 1.1.1.1
    - https://dns.adguard.com/dns-query

TUN:
  disable: true

profile:
  store-selected: true
  store-failed: true

# Default proxy groups template
proxy-groups:
  - name: ⚡️ Auto
    type: auto
    url: 'http://example.com/autoproxy'
    interval: 5

  - name: 🏷 Proxy
    type: select
    proxies:
      - Proxy 1
      - Proxy 2

# Proxy-groups definitions for different services and regions
proxy-groups:
  - name: ChatGPT
    type: select
    proxies:
      - Proxy 1
      - Proxy 2
  - name: Claude
    type: select
    proxies:
      - Proxy 1
      - Proxy 2
  - name: GitHub
    type: select
    proxies:
      - Proxy 1
      - Proxy 2
  - name: Telegram
    type: select
    proxies:
      - Proxy 1
      - Proxy 2
  - name: Hong Kong
    type: select
    proxies:
      - Proxy 1
      - Proxy 2
  - name: Taiwan
    type: select
    proxies:
      - Proxy 1
      - Proxy 2
  - name: Japan
    type: select
    proxies:
      - Proxy 1
      - Proxy 2
  - name: Singapore
    type: select
    proxies:
      - Proxy 1
      - Proxy 2
  - name: Korea
    type: select
    proxies:
      - Proxy 1
      - Proxy 2
  - name: USA
    type: select
    proxies:
      - Proxy 1
      - Proxy 2
  - name: UK
    type: select
    proxies:
      - Proxy 1
      - Proxy 2
  - name: Others
    type: select
    proxies:
      - Proxy 1
      - Proxy 2

# Rules engine with all RULE-SET entries
rules:
  - DOMAIN-SUFFIX,example.com,Proxy 1
  - IP-CIDR,192.168.0.0/16,Proxy 2

# Rule-anchor definitions
rule-anchors:
  - name: Example Anchor
    type: select
    proxies:
      - Proxy 1
      - Proxy 2

# Complete rule-providers with domain and IP providers
rule-providers:
  example:
    type: http
    behavior: classical
    url: https://example.com/rules.yaml
