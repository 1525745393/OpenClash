# 完整配置示例

# 机场订阅
submarine:
  type: "http"
  url: "你的机场订阅地址"

# 代理提供者
proxy-providers:
  provider1:
    type: "http"
    url: "你的提供者地址"

# 代理配置
proxies:
  - name: "代理1"
    type: "ss"
    server: "你的服务器地址"
    port: 12345
    password: "你的密码"
    cipher: "chacha20-ietf-poly1305"

# 端口设置
port:
  redir-port: 7890
  port: 7891

# DNS设置
DNS:
  enable: true
  servers:
    - "114.114.114.114"
    - "8.8.8.8"

# TUN模块
tun:
  enable: true

# 代理组
proxy-groups:
  - name: "Auto"
    type: "url-test"
    proxies:
      - "代理1"
      - "proxy-providers"
  - name: "手动"
    type: "select"
    proxies:
      - "代理1"
  - name: "越南"
    type: "select"
    proxies:
      - "manual"
      - "auto"
  - name: "马来西亚"
    type: "select"
    proxies:
      - "manual"
      - "auto"
  - name: "泰国"
    type: "select"
    proxies:
      - "manual"
      - "auto"
  - name: "菲律宾"
    type: "select"
    proxies:
      - "manual"
      - "auto"
  - name: "俄罗斯"
    type: "select"
    proxies:
      - "manual"
      - "auto"
  - name: "墨西哥"
    type: "select"
    proxies:
      - "manual"
      - "auto"
  - name: "印度"
    type: "select"
    proxies:
      - "manual"
      - "auto"
  - name: "巴西"
    type: "select"
    proxies:
      - "manual"
      - "auto"

# 规则设置
rules:
  - "DOMAIN-SUFFIX,google.com,Proxy"