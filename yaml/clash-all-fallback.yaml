# 马来西亚组
- name: 马来西亚-故转
  type: fallback
  interval: 300
  lazy: false
  proxies:
    - 马来西亚-手动
    - 马来西亚-自动
- name: 马来西亚-手动
  type: select
  include-all: true
  filter: "(?=.*(马来西亚|馬來西亞|MY|Malaysia|🇲🇾)).*$"
- name: 马来西亚-自动
  type: url-test
  include-all: true
  tolerance: 50
  interval: 300
  filter: "(?=.*(马来西亚|馬來西亞|MY|Malaysia|🇲🇾)).*$"

