# OpenClash 覆写（Overwrite）· 双 AdGuardHome DNS 分流
# 用途：Mihomo 作为全屋 DNS 入口，后端接 NAS 双 AGH
#   - AGH 国内  192.168.1.6:5550  上游腾讯 DoH，直连
#   - AGH 国外  192.168.1.6:5551  上游海外 DoH，容器出站必须走代理
# 用法：OpenClash 覆写管理 → 添加覆写 → 类型 YAML → 粘贴并启用 → 重启内核
# 回退：关闭此覆写并重启内核即恢复 v56 原生 DNS，主配置不改动
# 注意：AGH 国外实例(5551)出站若直连会导致上游污染，必须走代理
dns!:
  enable: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.20.0.1/16
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
  nameserver:
    - udp://192.168.1.6:5550
  nameserver-policy:
    "geosite:cn":
      - udp://192.168.1.6:5550
    "geosite:geolocation-!cn,geosite:google,geosite:github,geosite:openai":
      - udp://192.168.1.6:5551
  proxy-server-nameserver:
    - udp://192.168.1.6:5550
  direct-nameserver:
    - udp://192.168.1.6:5550
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
    domain:
      - "+.google.com"
      - "+.facebook.com"
      - "+.twitter.com"
