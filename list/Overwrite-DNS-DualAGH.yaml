# OpenClash 覆写（Overwrite）· 双 AdGuardHome DNS 分流
# 用途：Mihomo 作为全屋 DNS 入口，后端接 NAS 双 AGH
#   - AGH 国内  192.168.1.6:5550  上游腾讯 DoH，直连
#   - AGH 国外  192.168.1.6:5551  上游海外 DoH，容器出站必须走代理
# 用法：OpenClash 覆写管理 → 添加覆写 → 类型 YAML → 粘贴并启用 → 重启内核
# 回退：关闭此覆写并重启内核即恢复 v56 原生 DNS，主配置不改动
# v56 兼容要点：
#   - listen 必须保持 0.0.0.0:7874（OpenClash Dnsmasq Redirect 链路端口，勿改 53）
#   - 双 AGH 上游均可信，fallback 清空，避免海外 DoH 直连失败路径
#   - nameserver-policy 键避开 ! 特殊字符（规范要求键名含特殊字符用 <key>）
dns!:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.20.0.1/16
  cache: true
  cache-algorithm: lru
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
  nameserver:
    - udp://192.168.1.6:5550
  nameserver-policy:
    "geosite:cn":
      - udp://192.168.1.6:5550
    "geosite:google":
      - udp://192.168.1.6:5551
    "geosite:github":
      - udp://192.168.1.6:5551
    "geosite:openai":
      - udp://192.168.1.6:5551
  proxy-server-nameserver:
    - udp://192.168.1.6:5550
  direct-nameserver:
    - udp://192.168.1.6:5550
  fallback: []
